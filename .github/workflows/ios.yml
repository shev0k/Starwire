name: iOS

# The iPhone and iPad app under ios/: generates the Xcode project from ios/project.yml with
# XcodeGen, builds it for the iOS simulator in Debug and Release, runs the app's unit tests on a
# simulator and the StarwireKit tests, and builds the device-run UI tests.
# Signing and the iPad itself are the Mac's job (docs/ios/mac-runbook.md). Actions are pinned to
# full commit hashes; the comment says which release each one is.
on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - '.gitmodules'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.gitmodules'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator builds and tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the iOS submodules; Android's common-c isn't needed here
      - name: Submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            ios/moonlight-common/moonlight-common-c ios/X1Kit ios/third_party/imgui \
            ios/third_party/implot ||
          git submodule update --init --recursive \
            ios/moonlight-common/moonlight-common-c ios/X1Kit ios/third_party/imgui \
            ios/third_party/implot
          git submodule status --recursive ios

      - name: Tools
        run: |
          mkdir -p logs
          xcodebuild -version | tee logs/versions.txt
          swift --version | tee -a logs/versions.txt
          brew install xcodegen
          xcodegen --version | tee -a logs/versions.txt
          # Xcode can come without the iOS platform; upstream's CI downloads it the same way
          if ! xcodebuild -showsdks | grep -q iphonesimulator; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build for the simulator (Debug)
        working-directory: ios
        run: |
          set -o pipefail
          # Signed ad hoc like the unit tests below, which reuse this build: different signing
          # settings would leave them a stale precompiled header
          xcodebuild -project Starwire.xcodeproj -scheme Starwire -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/DerivedData \
            CODE_SIGN_IDENTITY=- build 2>&1 | tee ../logs/build-debug.log

      - name: Build for the simulator (Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Starwire.xcodeproj -scheme Starwire -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../logs/build-release.log

      # The app's unit tests (StarwireTests) on whichever iPad simulator this Xcode has, else an
      # iPhone one
      # Signed ad hoc ("-"), which needs no certificate: an unsigned app gets no Keychain on the
      # simulator, and the identity tests use it
      - name: Unit tests on the simulator
        working-directory: ios
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds]
          pick = [d for d in ios if "iPad Pro" in d["name"]] or [d for d in ios if "iPhone" in d["name"]]
          print(pick[0]["udid"] if pick else "")
          ')
          if [ -z "$udid" ]; then echo "no iOS simulator available"; exit 1; fi
          xcrun simctl list devices | grep "$udid" | tee -a ../logs/versions.txt
          xcodebuild -project Starwire.xcodeproj -scheme Starwire -configuration Debug \
            -destination "id=$udid" -derivedDataPath ../build/DerivedData \
            -resultBundlePath ../logs/unit-tests.xcresult \
            CODE_SIGN_IDENTITY=- test 2>&1 | tee ../logs/unit-tests.log

      # The device checks need the iPad and the PC, so CI only checks that they build
      - name: Build the device-run UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Starwire.xcodeproj -scheme StarwireDeviceRun -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee ../logs/build-device-run.log

      - name: StarwireKit tests
        run: |
          set -o pipefail
          swift test --package-path ios/StarwireKit 2>&1 | tee logs/starwirekit-tests.log

      # Warnings and errors first, so the log is quick to read
      - name: Summary
        if: always()
        run: |
          for f in logs/build-*.log logs/unit-tests.log; do
            [ -f "$f" ] || continue
            echo "== $f: $(grep -c ' warning: ' "$f" || true) warning lines, $(grep -c ' error: ' "$f" || true) error lines"
            grep ' error: ' "$f" | sort -u | head -50 || true
          done | tee logs/summary.txt
          # Errors and failed tests as annotations too, so they show on the run page without
          # downloading the logs
          for f in logs/build-*.log logs/unit-tests.log; do
            [ -f "$f" ] || continue
            grep -E ' error: |: error: -\[' "$f" | sort -u | head -30 | while IFS= read -r line; do
              echo "::error title=$(basename "$f")::${line}"
            done || true
          done
          if [ -f logs/unit-tests.log ]; then
            grep -E "Executed [0-9]+ tests?, with" logs/unit-tests.log | tail -1 | while IFS= read -r line; do
              echo "::notice title=unit tests::${line}"
            done || true
            grep -E "Test Suite '(All tests|.*\.xctest)'|Executed [0-9]+ tests|error: -\[|failed \(" logs/unit-tests.log | tail -40 | tee -a logs/summary.txt || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-logs
          path: logs/
          retention-days: 7
